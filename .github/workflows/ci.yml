name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "demo/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  APP_VERSION: "1.0.0"
  IMAGE_NAME: projektuppgift-ci-cd

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check app tests

      - name: Run unit and API tests
        run: python -m pytest -v --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/

  build:
    name: Build and Integration Test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Docker image
        run: docker build --build-arg APP_VERSION="$APP_VERSION" -t "$IMAGE_NAME:$APP_VERSION" .

      - name: Start container
        run: docker run -d --name test-app -p 8000:8000 "$IMAGE_NAME:$APP_VERSION"

      - name: Wait until container is healthy
        run: scripts/verify.sh "$APP_VERSION"

      - name: Run integration tests against container
        env:
          BASE_URL: http://127.0.0.1:8000
          EXPECTED_VERSION: ${{ env.APP_VERSION }}
        run: python -m pytest -v -m integration

      - name: Show container logs
        if: always()
        run: docker logs test-app || true

      - name: Remove container
        if: always()
        run: docker rm -f test-app || true

  deploy:
    name: Deploy (simulated)
    needs: [test, build]
    # Only deploy for pushes (main, demo/**), never for pull requests,
    # and only if every earlier job succeeded.
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy container
        run: scripts/deploy_local.sh "$APP_VERSION"

      - name: Verify deployment
        run: scripts/verify.sh "$APP_VERSION"

      - name: Remove container
        if: always()
        run: docker rm -f projektuppgift-app || true
